  <text x="56" y="157" fill="#f0f7ff" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="700" letter-spacing="-2">Proxmark Studio</text>
  <text x="60" y="211" fill="#a9c0d2" font-family="Arial, Helvetica, sans-serif" font-size="25">Read fobs. Manage holders. Verify writes.</text>
  <rect x="60" y="257" width="142" height="32" rx="16" fill="#183044" stroke="#2d4a60"/>
  <text x="131" y="278" text-anchor="middle" fill="#d6e8f2" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">WINDOWS x64</text>
  <rect x="214" y="257" width="184" height="32" rx="16" fill="#183044" stroke="#2d4a60"/>
  <text x="306" y="278" text-anchor="middle" fill="#d6e8f2" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.3">macOS APPLE SILICON</text>
  <g transform="translate(1000 174)">
