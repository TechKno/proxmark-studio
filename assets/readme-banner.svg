<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Proxmark Studio</title>
  <desc id="desc">Read fobs. Manage holders. Verify writes. A desktop workspace for Windows and Apple Silicon, illustrated with a contactless fob.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#101c30"/>
      <stop offset="1" stop-color="#080f1c"/>
    </linearGradient>
    <linearGradient id="fob" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#233c55"/>
      <stop offset="1" stop-color="#102235"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#6e9ab3" stroke-opacity=".065"/>
    </pattern>
  </defs>
  <rect width="1280" height="360" rx="20" fill="url(#background)"/>
  <rect width="1280" height="360" rx="20" fill="url(#grid)"/>
  <path d="M0 339H1280" stroke="#2dd4bf" stroke-opacity=".16"/>
  <rect x="60" y="59" width="8" height="8" rx="4" fill="#5eead4"/>
